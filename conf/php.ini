expose_php = Off
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 60
max_input_vars = 3000
date.timezone = UTC
cgi.fix_pathinfo = 0
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
